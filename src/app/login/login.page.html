<ion-content [fullscreen]="true" class="login-fondo">
  <!-- Animación 1: manchas de color que flotan lento en el fondo -->
  <div class="mancha m1"></div>
  <div class="mancha m2"></div>
  <div class="mancha m3"></div>

  <main class="contenedor">
    <!-- Animación 2: la tarjeta sube al entrar; se sacude si hay error -->
    <div class="entrada">
    <section class="tarjeta" [class.sacudir]="sacudir">
      <div class="marca">
        <div class="logo" aria-hidden="true">
          <span></span><span></span><span></span>
          <span></span><span class="hoy"></span><span></span>
        </div>
        <h1>FitHábitos</h1>
        <p class="lema">Un día a la vez.</p>
      </div>

      <div class="selector" role="tablist">
        <div class="pastilla" [class.derecha]="modo === 'registro'"></div>
        <button role="tab" [attr.aria-selected]="modo === 'login'" (click)="cambiarModo('login')">Entrar</button>
        <button role="tab" [attr.aria-selected]="modo === 'registro'" (click)="cambiarModo('registro')">Crear cuenta</button>
      </div>

      <form (ngSubmit)="enviar()" autocomplete="on">
        <label *ngIf="modo === 'registro'" class="campo aparecer">
          <span>Nombre</span>
          <input name="nombre" [(ngModel)]="nombre" autocomplete="name" placeholder="¿Cómo te llamas?" />
        </label>

        <label class="campo">
          <span>Servidor (IP:puerto)</span>
          <input name="servidor" [(ngModel)]="servidor" inputmode="url" autocapitalize="off"
                 autocorrect="off" spellcheck="false" placeholder="10.0.2.2:8080" />
          <small class="ayuda">En el emulador usa 10.0.2.2:8080. En un celular, la IP de tu PC.</small>
        </label>

        <label class="campo">
          <span>Correo</span>
          <input name="email" type="email" [(ngModel)]="email" autocomplete="email"
                 inputmode="email" placeholder="tucorreo@ejemplo.com" />
        </label>

        <label class="campo">
          <span>Contraseña</span>
          <div class="con-ojo">
            <input name="password" [type]="verPass ? 'text' : 'password'" [(ngModel)]="password"
                   [autocomplete]="modo === 'login' ? 'current-password' : 'new-password'"
                   placeholder="Mínimo 6 caracteres" />
            <button type="button" class="ojo" (click)="verPass = !verPass"
                    [attr.aria-label]="verPass ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <ion-icon [name]="verPass ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </label>

        <label *ngIf="modo === 'registro'" class="campo aparecer">
          <span>Confirma tu contraseña</span>
          <input name="password2" [type]="verPass ? 'text' : 'password'" [(ngModel)]="password2"
                 autocomplete="new-password" placeholder="Escríbela otra vez" />
        </label>

        <p class="error" *ngIf="error" role="alert">{{ error }}</p>

        <button class="principal" type="submit" [disabled]="cargando">
          <ion-spinner *ngIf="cargando" name="crescent"></ion-spinner>
          <span *ngIf="!cargando">{{ modo === 'login' ? 'Entrar' : 'Crear mi cuenta' }}</span>
        </button>
      </form>

      <p class="offline" *ngIf="!enLinea">
        <ion-icon name="cloud-offline-outline"></ion-icon>
        Sin conexión: puedes entrar con una cuenta que ya usaste en este dispositivo.
      </p>
    </section>
    </div>
  </main>
</ion-content>
