<ion-content class="editor">
  <header class="barra">
    <button class="texto" (click)="cancelar()">Cancelar</button>
    <h2>Acomoda tu foto</h2>
    <button class="usar" (click)="usar()" [disabled]="!lista">Usar foto</button>
  </header>

  <p class="ayuda">Mueve el recuadro y jala sus esquinas. Lo que quede adentro será tu fondo.</p>

  <!-- La foto completa con el recuadro encima -->
  <div #zona class="zona">
    <div class="lienzo" *ngIf="lista" [style.width.px]="dispW" [style.height.px]="dispH"
         (pointerdown)="tocar($event)" (pointermove)="mover($event)"
         (pointerup)="soltar($event)" (pointercancel)="soltar($event)" (wheel)="rueda($event)">
      <img [src]="imagen" alt="" draggable="false" />
      <div class="recorte" data-modo="mover"
           [style.left.px]="c.x * s" [style.top.px]="c.y * s"
           [style.width.px]="c.w * s" [style.height.px]="c.h * s">
        <span class="esquina nw" data-modo="nw"></span>
        <span class="esquina ne" data-modo="ne"></span>
        <span class="esquina sw" data-modo="sw"></span>
        <span class="esquina se" data-modo="se"></span>
      </div>
    </div>
  </div>

  <section class="abajo">
    <!-- Vista previa de cómo quedará detrás del calendario -->
    <div class="vista">
      <span class="etiqueta">Así se verá</span>
      <div class="mini" [style.aspect-ratio]="aspectoNum"
           [style.background-image]="lista ? 'url(' + imagen + ')' : null"
           [style.background-size]="fondoTam" [style.background-position]="fondoPos">
        <div class="capa" [style.opacity]="1 - visibilidad"></div>
        <div class="fantasma" aria-hidden="true"><span *ngFor="let x of casillas"></span></div>
      </div>
    </div>

    <div class="controles">
      <label>
        <span class="etiqueta">Qué tanto se ve la foto: {{ (visibilidad * 100).toFixed(0) }}%</span>
        <div class="fila">
          <ion-icon name="eye-off-outline"></ion-icon>
          <input type="range" min="0.1" max="0.8" step="0.01" [value]="visibilidad"
                 (input)="visibilidad = +$any($event.target).value" aria-label="Visibilidad de la foto" />
          <ion-icon name="eye-outline"></ion-icon>
        </div>
      </label>
      <button class="centrar" (click)="reiniciar()">
        <ion-icon name="scan-outline"></ion-icon> Volver a empezar
      </button>
    </div>
  </section>
</ion-content>
